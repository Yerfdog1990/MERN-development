<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Example</title>
</head>
<body>
     <!-- list : collection of items (ordered <ol> </ol> 123 , a b c, A BC , i ii iii, I II III and unordered <ul></ul> : disc , square , circle) -->
      <h2> Ordered List </h2>
      <ol type="i" start="11">
          <li> First 
             <ul>
                <li> AA
                    <ol>
                        <li> xx</li>
                        <li> yy</li>
                    </ol>
                </li>
                <li> BB </li>
                <li> CC</li>
             </ul>
          </li>
          <li> Second </li>
          <li> Third </li>
      </ol>
      <hr/>
      <h2> UnOrdered List </h2>
      <ul type="circle">
          <li> First</li>
          <li> Second </li>
          <li> Third </li>
      </ul>
      <hr/>
</body>
</html>
