<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
</head>
<body>
    <h2> Inheritance</h2>
    <script>
       class Person //parent
       {
          constructor(f,l){
            this.fname=f;
            this.lname=l;
          }
          getFullName(){
            return `${this.fname} ${this.lname}`
          }
       }
       class Employee extends Person //child
       {
          constructor(fname,lname,age){
            super(fname,lname);//send to parent constructor
            this.empage=age;
          }
          getFullDetails(){
              console.log(`${super.getFullName()} is ${this.empage} year old!`)
          }
       }
       const obj=new Employee("anuj","singh",45);
       obj.getFullDetails()
    </script>
</body>
</html>
