<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator</title>
</head>
<body>
    <h2> Rest Parameter Example</h2>
    <script>
        function myAddition(x,...args){
          let sum=0;
          args.forEach(val=> sum+=val);
          return sum;
        }
        console.log(myAddition(2,3,4))
        console.log(myAddition(2,3,4,5,6))
        console.log(myAddition(2,3))
        console.log(myAddition(2,3,9,7))
    </script>
</body>
</html>
