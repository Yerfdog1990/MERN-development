<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback</title>
</head>
<body>
    <h2> Callback</h2>
    <script>
        function xyz(callback){
         console.log("start")
           setTimeout(()=>{
             callback()
           },2000)
        }
        function abc(){
           console.log("Hello callback")
        }
        xyz(abc)
    </script>
</body>
</html>
