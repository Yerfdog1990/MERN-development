<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise</title>
</head>
<body>
    <h2> Promise Time example</h2>
    <script>
       function getUser(uid,callback){
        return new Promise((resolve,reject)=>{
            console.log("Fetch user from db")
          setTimeout(()=>{
               resolve({name:'sumit',uid:uid})
          },2000)
        })
         
       }
       function getServices(user,callback){
        return new Promise((resolve,reject)=>{
           console.log("Fetch services of user")
          setTimeout(()=>{
               resolve(["A","B","C","D"])
          },3000)
        })
       
       }
        function findServicesCost(services,callback){
            return new Promise((resolve,reject)=>{
                console.log("Find cost of services")
          setTimeout(()=>{
               resolve(services.length*500)
          },4000)
            })
         
       }
    
       getUser(101)
       .then(users=> getServices(users))
       .then(services=> findServicesCost(services))
       .then(cost=> console.log(cost))
       .catch(err=> console.log(err))
      
    </script>
</body>
</html>
