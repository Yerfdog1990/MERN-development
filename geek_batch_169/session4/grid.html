<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Example</title>
    <style>
       main{
         display: grid;
         grid-template-areas:
           "headerr headerr"
           "menu content"
           "footerr footerr"
         ;
         grid-template-columns: 1fr 3fr;
         gap:2px;
         padding: 5px;
       }
       header{
         grid-area: headerr;
         text-align: center;
         background-color: crimson;
         color: white;

       }
       nav{
        grid-area: menu;
        height: 300px;
       }
       section{
         grid-area: content;
         height: 300px;
       }
       footer{
        grid-area: footerr;
        text-align: center;
         background-color: crimson;
         color: white;
       }
    </style>
</head>
<body>
    <main>
        <header>
            <h2> My Header</h2>
        </header>
        <nav>
            menu
        </nav>
        <section>
            content area
        </section>
        <footer>
            footer area
        </footer>
    </main>
</body>
</html>
