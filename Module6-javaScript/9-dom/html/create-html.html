<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creating HTML Element with JS</title>
  <style>
    .card-container {
      width: 200px;
      display: flex;
      flex-direction: column;
    }

    .card-container img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-container span {
      padding: 8px;
      box-sizing: border-box;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

<div id="parent-container">

  <div class="card-container">

    <img
            class="image"
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
            alt="travel-card">

    <span>The journey of a thousand miles begins with a single step.</span>

  </div>

</div>
<script>
  let parentContainer = document.getElementById('parent-container');

  // Create a container
  const cardContainer = document.createElement('div');
  cardContainer.classList.add('card-container');

  // Create card image element
  const cardImage = document.createElement('img');
  cardImage.classList.add('image');
  cardImage.src = 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee';
  cardImage.setAttribute('alt', 'travel-card');

  // Append card container to parent container
  parentContainer.appendChild(cardContainer);

  // Append image to card container
  cardContainer.appendChild(cardImage);

  // Create text element
  const cardText = document.createElement('span');
  cardText.textContent = 'The journey of a thousand miles begins with a single step.';
  cardContainer.appendChild(cardText);
</script>
</body>
</html>
