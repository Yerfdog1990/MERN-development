<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>event listener</title>
    <style>
        form{
            border: 1px solid black;
            padding: 10px;
        }
        div{
            border: 1px solid black;
            padding: 10px;
        }
        p{
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
<div class="main-heading">
    <h1>Event Listeners</h1>
</div>
<form action="" id="form">
    Form
    <div id="div">
        Div
        <p id="para">
            Paragraph
        </p>
    </div>
</form>
<script>
    // Event bubbling
    let formBubble = document.getElementById('form');
    formBubble.addEventListener('click', function () {
        alert('Form clicked');
    })

    let divBubble = document.getElementById('div');
    divBubble.addEventListener('click', function () {
        alert('Div clicked');
    })

    let paraBubble = document.getElementById('para');
    paraBubble.addEventListener('click', function () {
        alert('Paragraph clicked');
    })

    // Event capturing
    let formCapture = document.getElementById('form');
    formCapture.addEventListener('click', function () {
        alert('Form clicked');
    }, true)

    let divCapture = document.getElementById('div');
    divCapture.addEventListener('click', function () {
        alert('Div clicked');
    }, true)

    let paraCapture = document.getElementById('para');
    paraCapture.addEventListener('click', function () {
        alert('Paragraph clicked');
    }, true)

</script>
</body>
</html>
